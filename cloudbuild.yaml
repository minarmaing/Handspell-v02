steps:
  # Step 0: Download the models directory from your bucket directly into the build environment
  - name: 'gcr.io/cloud-builders/gsutil'
    args: ['-m', 'cp', '-r', 'gs://${_BUCKET_NAME}/models', '.']

  # Step 1: Build the container image using Docker
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/handspell-api', '.']

  # Step 2: Push the compiled container image out to your project's Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/handspell-api']

  # Step 3: Deploy the container directly onto Cloud Run
  - name: 'gcr.io/://google.com'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'handspell-landmarks-asl-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/handspell-api'
      - '--region'
      - 'europe-west1'
      - '--allow-unauthenticated'

options:
  logging: CLOUD_LOGGING_ONLY
