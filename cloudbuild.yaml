steps:
  # Step 1: Download your models folder from GCS directly into a local directory using secure defaults
  - name: 'gcr.io/cloud-builders/gsutil'
    args: ['-m', 'cp', '-r', 'gs://${_BUCKET_NAME}/models', './models']

  # Step 2: Build the container image using Docker, embedding the models folder we just downloaded
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/handspell-api', '.']

  # Step 3: Push the compiled container image out to your project's Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/handspell-api']

  # Step 4: Deploy the container directly onto Cloud Run
  - name: 'gcr.io/://google.com'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'handspell-landmarks-asl-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/handspell-api'
      - '--region'
      - 'europe-west1'
      - '--allow-unauthenticated'

options:
  logging: CLOUD_LOGGING_ONLY
